<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Chris Wong's computational physics and engineering portfolio, covering numerical simulation, local AI tooling, and 3D Gaussian Splatting."
    >
    <meta
        name="keywords"
        content="computational physics, cold atom physics, quantum simulation, numerical modeling, 3D Gaussian Splatting, COLMAP, CUDA, gsplat"
    >
    <meta name="author" content="Chris Wong">
    <link rel="canonical" href="https://kuchris.github.io">
    <link rel="icon" href="images/kuicon.ico">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Chris Wong | Computational Physics Portfolio">
    <meta
        property="og:description"
        content="Computational physics and engineering portfolio featuring numerical simulation, local AI tooling, and 3D Gaussian Splatting."
    >
    <meta property="og:url" content="https://kuchris.github.io">
    <meta property="og:site_name" content="Chris Wong">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Chris Wong | Computational Physics Portfolio">
    <meta
        name="twitter:description"
        content="Computational physics and engineering portfolio featuring scientific computing, AI tooling, and 3D Gaussian Splatting."
    >

    <title>Chris Wong | Computational Physics Portfolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/skills.css?v=20260521">

</head>
<body>
    <div class="page-noise" aria-hidden="true"></div>

    <header class="site-header">
        <nav class="site-nav container" aria-label="Primary">
            <a href="#top" class="brand">
                <span class="brand-mark">CW</span>
                <span class="brand-text">
                    <strong>Chris Wong</strong>
                    <span class="brand-subtitle">Computational Physics</span>
                </span>
            </a>

            <button
                type="button"
                class="nav-toggle"
                id="nav-toggle"
                aria-expanded="false"
                aria-controls="site-menu"
                aria-label="Toggle navigation"
            >
                <span></span>
                <span></span>
            </button>

            <div class="nav-panel" id="site-menu">
                <ul class="nav-links">
                    <li><a id="nav-about" href="#about"></a></li>
                    <li><a id="nav-skills" href="#skills"></a></li>
                    <li><a id="nav-timeline" href="#timeline"></a></li>
                    <li><a id="nav-projects" href="#projects"></a></li>
                    <li><a id="nav-contact" href="#contact"></a></li>
                </ul>

                <div class="language-switch" role="group" aria-label="Language switcher">
                    <button type="button" class="btn-language" data-lang="en">EN</button>
                    <button type="button" class="btn-language" data-lang="jp">JP</button>
                </div>
            </div>
        </nav>
    </header>

    <main id="top">
        <section class="hero">
            <div class="hero-orbit hero-orbit-left" aria-hidden="true"></div>
            <div class="hero-orbit hero-orbit-right" aria-hidden="true"></div>

            <div class="container hero-grid">
                <div class="hero-copy">
                    <p id="hero-kicker" class="eyebrow"></p>
                    <h1 id="hero-title" class="hero-title"></h1>
                    <p id="hero-subtitle" class="hero-subtitle"></p>
                    <p id="hero-description" class="hero-description"></p>

                    <div class="hero-actions">
                        <a id="cta-research" href="#projects" class="btn btn-primary"></a>
                        <a
                            id="cta-github"
                            href="https://github.com/kuchris"
                            class="btn btn-secondary"
                            target="_blank"
                            rel="noopener noreferrer"
                        ></a>
                        <a
                            id="cta-cv"
                            href="files/Chris_Wong_CV.pdf"
                            class="btn btn-secondary"
                            download="Chris_Wong_CV.pdf"
                            data-cv-link
                        ></a>
                    </div>

                    <div class="hero-stats">
                        <article class="stat-card">
                            <p id="hero-stat-1-value" class="stat-value"></p>
                            <p id="hero-stat-1-label" class="stat-label"></p>
                        </article>
                        <article class="stat-card">
                            <p id="hero-stat-2-value" class="stat-value"></p>
                            <p id="hero-stat-2-label" class="stat-label"></p>
                        </article>
                        <article class="stat-card">
                            <p id="hero-stat-3-value" class="stat-value"></p>
                            <p id="hero-stat-3-label" class="stat-label"></p>
                        </article>
                    </div>
                </div>

                <aside class="hero-panel">
                    <div class="profile-frame">
                        <img
                            src="images/profile.jpg"
                            alt="Chris Wong portrait"
                            loading="eager"
                            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                        >
                        <div class="profile-placeholder" style="display: none;">CW</div>
                    </div>

                    <div class="hero-panel-copy">
                        <p id="hero-panel-label" class="panel-label"></p>
                        <h2 id="hero-panel-title" class="panel-title"></h2>
                        <p id="hero-panel-text" class="panel-text"></p>
                    </div>

                    <dl class="hero-details">
                        <div>
                            <dt id="hero-detail-1-label"></dt>
                            <dd id="hero-detail-1-value"></dd>
                        </div>
                        <div>
                            <dt id="hero-detail-2-label"></dt>
                            <dd id="hero-detail-2-value"></dd>
                        </div>
                        <div>
                            <dt id="hero-detail-3-label"></dt>
                            <dd id="hero-detail-3-value"></dd>
                        </div>
                    </dl>
                </aside>
            </div>
        </section>

        <section id="about" class="section">
            <div class="container">
                <div class="section-header">
                    <p id="about-kicker" class="eyebrow"></p>
                    <h2 id="about-title" class="section-title"></h2>
                </div>

                <div class="about-grid">
                    <div class="about-copy">
                        <p id="about-text" class="about-text"></p>
                    </div>

                    <aside class="about-card">
                        <p id="about-card-label" class="panel-label"></p>
                        <h3 id="about-card-title" class="about-card-title"></h3>
                        <ul class="about-points">
                            <li id="about-point-1"></li>
                            <li id="about-point-2"></li>
                            <li id="about-point-3"></li>
                        </ul>
                    </aside>
                </div>
            </div>
        </section>

        <section id="skills" class="section section-muted">
            <div class="container">
                <div class="section-header split-header">
                    <div>
                        <p id="skills-kicker" class="eyebrow"></p>
                        <h2 id="skills-title" class="section-title"></h2>
                    </div>
                    <p id="skills-description" class="section-intro"></p>
                </div>

                <div class="skills-shell">
                    <div id="skills-cards" class="skills-cards" aria-live="polite">
                        <div class="loading-indicator">Loading skills...</div>
                    </div>
                </div>
            </div>
        </section>

        <section id="timeline" class="section">
            <div class="container">
                <div class="section-header split-header">
                    <div>
                        <p id="timeline-kicker" class="eyebrow"></p>
                        <h2 id="timeline-title" class="section-title"></h2>
                    </div>
                    <p id="timeline-description" class="section-intro"></p>
                </div>

                <div id="timeline-container" class="timeline">
                    <div class="loading-indicator">Loading timeline...</div>
                </div>
            </div>
        </section>

        <section id="projects" class="section section-muted">
            <div class="container">
                <div class="section-header split-header">
                    <div>
                        <p id="projects-kicker" class="eyebrow"></p>
                        <h2 id="projects-title" class="section-title"></h2>
                    </div>
                    <p id="projects-description" class="section-intro"></p>
                </div>

                <div id="projects-container" class="projects-grid">
                    <div class="loading-indicator">Loading research projects...</div>
                </div>
            </div>
        </section>

        <section id="contact" class="section">
            <div class="container">
                <div class="contact-card">
                    <div class="contact-copy">
                        <p id="contact-kicker" class="eyebrow"></p>
                        <h2 id="contact-title" class="section-title contact-title"></h2>
                        <p id="contact-description" class="section-intro contact-intro"></p>
                    </div>

                    <div class="contact-links">
                        <a href="mailto:kuchrisuk@gmail.com" class="contact-feature">
                            <span class="contact-feature-kicker" id="contact-email"></span>
                            <span class="contact-feature-value">kuchrisuk@gmail.com</span>
                            <span class="contact-feature-hint" id="contact-feature-hint"></span>
                        </a>

                        <div class="contact-secondary-grid">
                            <a
                                href="files/Chris_Wong_CV.pdf"
                                class="contact-tile"
                                download="Chris_Wong_CV.pdf"
                                data-cv-link
                            >
                                <span class="contact-tile-label" id="contact-cv"></span>
                                <span class="contact-tile-value">PDF</span>
                            </a>
                            <a
                                href="https://github.com/kuchris"
                                class="contact-tile"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                <span class="contact-tile-label" id="contact-github"></span>
                                <span class="contact-tile-value">@kuchris</span>
                            </a>
                            <a
                                href="https://www.researchgate.net/profile/Wai-Kui-Wong"
                                class="contact-tile"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                <span class="contact-tile-label" id="contact-researchgate"></span>
                                <span class="contact-tile-value">Profile</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p id="footer-text"></p>
        </div>
    </footer>

    <script src="js/skills-graph.js?v=20260521" defer></script>
    <script src="js/main.js?v=20260905" defer></script>
</body>
</html>
