<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO META TAGS -->
    <meta name="description" content="Chris Wong - Computational Physics researcher from Hong Kong specializing in cold atom systems, quantum simulations, and Python-based physics modeling. Expert in Schrödinger equations, Gross-Pitaevskii equations, and quantum many-body systems.">
    <meta name="keywords" content="computational physics, cold atom physics, Python simulation, quantum mechanics, Schrödinger equation, Gross-Pitaevskii equation, Feshbach resonances, BEC dynamics, quantum computing, CUHK, Hong Kong physics">
    <meta name="author" content="Chris Wong">
    <link rel="canonical" href="https://kuchris.github.io">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Chris Wong - Computational Physics & Cold Atom Research">
    <meta property="og:description" content="Physics researcher from Hong Kong specializing in computational methods, cold atom systems, and quantum simulations. Expert in Python-based physics modeling and quantum mechanics.">
    <meta property="og:url" content="https://kuchris.github.io">
    <meta property="og:site_name" content="Chris Wong - Physics Research">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Chris Wong - Computational Physics & Cold Atom Research">
    <meta name="twitter:description" content="Physics researcher specializing in computational methods and cold atom systems">

    <title>Chris Wong - Computational Physics & Cold Atom Research</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/skills.css">

    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com" defer></script>
    <script src="https://d3js.org/d3.v7.min.js" defer></script>
</head>
<body class="bg-gray-50 font-sans antialiased text-gray-800">
    <header>
        <nav class="container">
            <a href="#" class="logo">Chris Wong</a>
            <div class="nav-right-group">
                <ul class="nav-links">
                    <li><a href="#about">About</a></li>
                    <li><a href="#skills">Skills</a></li>
                    <li><a href="#timeline">Journey</a></li>
                    <li><a href="#projects">Research</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
                <div class="language-buttons">
                    <button class="btn-language active" onclick="switchLanguage('en')">EN</button>
                    <button class="btn-language" onclick="switchLanguage('jp')">JP</button>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <div class="hero-content">
                    <div class="profile-img">
                        <img src="images/profile.jpg" alt="Chris Wong" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                        <div class="profile-img-placeholder" style="display: none;">CW</div>
                    </div>
                    <h1 id="hero-title"></h1>
                    <p id="hero-subtitle" class="hero-subtitle"></p>
                    <p id="hero-description" class="hero-description"></p>
                    <div class="cta-buttons">
                        <a id="cta-research" href="#projects" class="btn btn-primary"></a>
                        <a id="cta-github" href="https://github.com/kuchris" class="btn btn-secondary" target="_blank" rel="noopener noreferrer"></a>
                    </div>
                </div>
            </div>
            <div class="particle" style="top: 20%; left: 10%; animation-delay: 0s;"></div>
            <div class="particle" style="top: 30%; left: 80%; animation-delay: 2s;"></div>
            <div class="particle" style="top: 60%; left: 15%; animation-delay: 4s;"></div>
            <div class="particle" style="top: 70%; left: 85%; animation-delay: 1s;"></div>
            <div class="particle" style="top: 40%; left: 70%; animation-delay: 3s;"></div>
        </section>

        <section id="about" class="section">
            <div class="container">
                <h2 id="about-title" class="section-title"></h2>
                <div style="max-width: 800px; margin: 0 auto; text-align: center; font-size: 1.1rem; line-height: 1.8;">
                    <p id="about-text"></p>
                </div>
            </div>
        </section>

        <!-- Technical Expertise Section -->
        <section id="skills" class="section">
            <div class="container">
                <h2 id="skills-title" class="section-title"></h2>
                <div id="skills-graph"></div>
            </div>
        </section>

        <section id="timeline" class="section">
            <div class="container">
                <h2 id="timeline-title" class="section-title"></h2>
                <div id="timeline-container" class="timeline relative pl-10 sm:pl-12">
                    <div id="loading-indicator">Loading timeline...</div>
                </div>
            </div>
        </section>

        <section id="projects" class="section">
            <div class="container">
                <h2 id="projects-title" class="section-title"></h2>
                <div id="projects-container" class="research-grid">
                    <div id="loading-indicator">Loading research projects...</div>
                </div>
            </div>
        </section>

        <section id="contact" class="section">
            <div class="container">
                <h2 id="contact-title" class="section-title"></h2>
                <div class="social-links">
                    <a href="mailto:kuchrisuk@gmail.com" class="social-link">
                        <span id="contact-email"></span>
                    </a>
                    <a href="https://github.com/kuchris" class="social-link">
                        <span id="contact-github"></span>
                    </a>
                    <a href="https://www.researchgate.net/profile/Wai-Kui-Wong" class="social-link">
                        <span id="contact-researchgate"></span>
                    </a>
                </div>
                <div style="text-align: center; margin-top: 3rem; max-width: 600px; margin-left: auto; margin-right: auto;">
                    <p id="contact-description" style="font-size: 1.1rem; color: #666;"></p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p id="footer-text"></p>
    </footer>

    <!-- External JavaScript -->
    <script src="js/skills-graph.js" defer></script>
    <script src="js/main.js" defer></script>
</body>
</html>
